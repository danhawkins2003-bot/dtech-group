<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- CARTE BLANCHE AUX COINS ARRONDIS -->
  <rect x="50" y="160" width="412" height="280" rx="32" ry="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#shadow)" />

  <!-- ARC D'ÉTOILES BLEUES -->
  <g fill="#3b82f6">
    <!-- Star 1 -->
    <polygon points="180,215 183,222 191,223 185,228 187,236 180,232 173,236 175,228 169,223 177,222" transform="scale(0.8) translate(45, 30)" />
    <!-- Star 2 -->
    <polygon points="215,200 218,207 226,208 220,213 222,221 215,217 208,221 210,213 204,208 212,207" transform="scale(0.85) translate(30, 20)" />
    <!-- Star 3 (Centre) -->
    <polygon points="256,192 260,201 270,202 262,209 265,219 256,214 247,219 250,209 242,202 252,201" transform="scale(0.9) translate(25, 12)" />
    <!-- Star 4 -->
    <polygon points="297,200 300,207 308,208 302,213 304,221 297,217 290,221 292,213 286,208 294,207" transform="scale(0.85) translate(35, 20)" />
    <!-- Star 5 -->
    <polygon points="332,215 335,222 343,223 337,228 339,236 332,232 325,236 327,228 321,223 329,222" transform="scale(0.8) translate(50, 30)" />
  </g>

  <!-- TEXTES DE LA CARTE -->
  <!-- DTECH GROUP -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#1e40af" text-anchor="middle" letter-spacing="1">
    DTECH GROUP
  </text>

  <!-- CABINET DE MANAGEMENT ETUDES & CONSEILS -->
  <text x="256" y="306" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
    CABINET DE MANAGEMENT ETUDES &amp; CONSEILS
  </text>

  <!-- AGREMENT N° 003 / METFP / CAB / SE-CPO -->
  <text x="256" y="338" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#047857" text-anchor="middle" letter-spacing="0.5">
    AGREMENT N° 003 / METFP / CAB / SE-CPO
  </text>

  <!-- SCEAU ROUGE CERTIFIED & DIPLÔME AGRÉÉ PAR L’ETAT -->
  <g transform="translate(85, 360)">
    <!-- Sceau circulaire Certified -->
    <circle cx="20" cy="12" r="14" fill="#dc2626" stroke="#b91c1c" stroke-width="2" />
    <circle cx="20" cy="12" r="11" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="20" y="15" font-family="system-ui, sans-serif" font-weight="900" font-size="6" fill="#ffffff" text-anchor="middle">CERTIFIED</text>

    <!-- DIPLÔME AGRÉÉ PAR L’ETAT -->
    <text x="44" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#047857" letter-spacing="0.5">
      DIPLÔME AGRÉÉ PAR L’ETAT
    </text>
  </g>

  <!-- TOQUE DE DIPLÔMÉ (MORTARBOARD 3D) EN HAUT À DROITE -->
  <g filter="url(#capShadow)">
    <!-- Calotte sous le chapeau -->
    <path d="M 315 155 Q 360 190 420 150 L 415 195 Q 365 225 310 190 Z" fill="#1e293b" />
    <!-- Bordure dorée sur le bas de la calotte -->
    <path d="M 310 190 Q 365 225 415 195" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Plateau losange incliné de la toque -->
    <polygon points="270,120 405,65 475,128 340,185" fill="url(#capGrad)" stroke="#334155" stroke-width="2" />

    <!-- Bouton central -->
    <ellipse cx="375" cy="125" rx="7" ry="5" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Ruban doré du gland -->
    <path d="M 375 125 Q 430 145 425 210" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Pompon / Gland doré -->
    <ellipse cx="425" cy="215" rx="5" ry="4" fill="#b45309" />
    <path d="M 420 215 L 415 260 Q 425 270 435 260 L 430 215 Z" fill="url(#goldGrad)" />
    <!-- Franges du pompon -->
    <line x1="416" y1="260" x2="414" y2="270" stroke="#d97706" stroke-width="1.5" />
    <line x1="420" y1="262" x2="419" y2="273" stroke="#d97706" stroke-width="1.5" />
    <line x1="425" y1="264" x2="425" y2="275" stroke="#d97706" stroke-width="1.5" />
    <line x1="430" y1="262" x2="431" y2="273" stroke="#d97706" stroke-width="1.5" />
    <line x1="434" y1="260" x2="436" y2="270" stroke="#d97706" stroke-width="1.5" />
  </g>
</svg>
